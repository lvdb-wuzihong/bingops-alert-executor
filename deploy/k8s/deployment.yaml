# bingops alert-executor 部署清单（设计文档 §12 运行形态）
# 纪律对照：
#   - 多副本无状态（2026-09-11 决策）：通知去重靠平台权威节流（firing：repeat notify 基于 DB updated_at；error：距同规则上一条 error ≥15min 才 notify=true）——DB 串行化保证并发回报时恰好一个副本拿到 notify=true 去发飞书。执行器本地限流仅作平台不可用时的兑底。仍不做分布式锁/Redis：代价是评估查询随副本数倍增（规则量大时按数据源静态归属分片，StatefulSet+ordinal 取模），for_rounds 防抖仍为各副本内存态（多副本下偏保守，宁漏勿误方向安全）。
#     error 15min 节流，DB 串行化保证并发回报时恰好一个副本拿到 notify=true）；
#     评估查询随副本数倍增，规则量大时改按数据源静态归属分片（StatefulSet+ordinal）
#   - 零入站端口：探针走 exec 心跳文件检查，不声明任何 ports
#   - 凭据红线：token / webhook 地址 / 数据源密码全部 Secret env 注入（*_ref 的实际值）
#   - executor 出口 IP 需在平台与各数据源侧加白（安全组源 IP 白名单，§12 部署边界）
apiVersion: v1
kind: Namespace
metadata:
  name: bingops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-executor-config
  namespace: bingops
  labels: {app: alert-executor}
data:
  config.yaml: |
    platform:
      base_url: http://bingops.bingops.svc:8000     # 平台服务地址（同 VPC 集群内）
      token_ref: BINGOPS_AGENT_TOKEN                # env 解引用
      timeout_seconds: 5
      fetch_interval_seconds: 30
    notify:
      default_channel:
        type: feishu-bot
        secret_ref: FEISHU_WEBHOOK_URL              # env 值 = 完整 webhook 地址
      dashboard_url: https://grafana.example.com
    evaluation:
      timeout_seconds: 10
      per_source_concurrency: 16
---
# 凭据统一放 Secret（生产建议接外部 secret 管理；此处为最简形态）
apiVersion: v1
kind: Secret
metadata:
  name: alert-executor-secrets
  namespace: bingops
  labels: {app: alert-executor}
stringData:
  BINGOPS_AGENT_TOKEN: "REPLACE_ME"                 # 平台 agent 静态 token
  FEISHU_WEBHOOK_URL: "REPLACE_ME"                  # 默认渠道飞书机器人完整地址
  # 数据源密码：名字须与平台「数据源管理」里登记的 password_ref 一致（按需增删）
  PROD_CH_READONLY: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-executor
  namespace: bingops
  labels: {app: alert-executor}
spec:
  replicas: 2                                       # 多副本无状态：去重靠平台权威节流
  strategy:
    type: RollingUpdate                             # 双副本窗口由平台节流去重，Recreate 不再强制
  selector:
    matchLabels: {app: alert-executor}
  template:
    metadata:
      labels: {app: alert-executor}
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001                      # emptyDir 卷属组 = appuser(10001)，保证可写
      containers:
        - name: executor
          image: registry.internal/bingops/alert-executor:latest   # 替换为实际镜像仓库
          imagePullPolicy: IfNotPresent
          # 零入站端口：不声明 ports
          # 文件日志：LOG_FILE 指向下方 logs 卷路径（{hostname}=Pod 名，多副本各写各的）；
          # 不需要文件日志时删掉这个 env 即可（仅 stdout）
          env:
            - name: LOG_FILE
              value: /var/log/alert-executor/executor-{hostname}.log
          envFrom:
            - secretRef:
                name: alert-executor-secrets
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/alert-executor
              readOnly: true
            - name: logs
              mountPath: /var/log/alert-executor
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time,sys; p=os.environ.get('ALERT_EXECUTOR_HEARTBEAT','/tmp/alert-executor-heartbeat');
                  sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time,sys; p=os.environ.get('ALERT_EXECUTOR_HEARTBEAT','/tmp/alert-executor-heartbeat');
                  sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<90 else 1)
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: alert-executor-config
        # 日志卷：emptyDir 随 Pod 生命周期；采集方式自选（sidecar vector 挂同一卷 /
        # 定期 kubectl cp / 换 hostPath + initContainer chown 均可，改这里即可）
        - name: logs
          emptyDir:
            sizeLimit: 512Mi
      terminationGracePeriodSeconds: 15
